<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900"
     role="img" aria-label="Steam Big Picture">
  <!-- The tile for Steam's own interface in the games browser.
       Drawn here rather than taken from the desktop, because the desktop's
       steam.png on this console is the steam-installer placeholder: a
       photograph of cardboard boxes. Not lifted from Steam's own assets
       either; those are Valve's, and a television with a controller in front
       of it says "Big Picture" better than a logo does anyway.
       Portrait, to sit in a row of box art. Palette is the page's own. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1642"/>
      <stop offset="1" stop-color="#100e28"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd447" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff3ea5" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#sky)"/>
  <rect x="14" y="14" width="572" height="872" fill="none"
        stroke="#7a6fc0" stroke-width="8"/>

  <!-- the television -->
  <rect x="96" y="214" width="408" height="256" rx="14"
        fill="#100e28" stroke="#ffd447" stroke-width="12"/>
  <rect x="118" y="236" width="364" height="212" rx="6" fill="url(#glass)"/>
  <!-- its stand -->
  <rect x="276" y="470" width="48" height="46" fill="#ffd447"/>
  <rect x="216" y="516" width="168" height="18" rx="9" fill="#ffd447"/>

  <!-- a controller in front of it -->
  <g transform="translate(300 640)">
    <rect x="-150" y="-56" width="300" height="112" rx="56"
          fill="#1c1642" stroke="#7a6fc0" stroke-width="10"/>
    <!-- d-pad -->
    <rect x="-104" y="-13" width="70" height="26" rx="6" fill="#f0eeff"/>
    <rect x="-82" y="-35" width="26" height="70" rx="6" fill="#f0eeff"/>
    <!-- buttons -->
    <circle cx="72" cy="-22" r="15" fill="#ffd447"/>
    <circle cx="104" cy="10" r="15" fill="#ff3ea5"/>
    <circle cx="40" cy="10" r="15" fill="#7a6fc0"/>
    <circle cx="72" cy="42" r="15" fill="#f0eeff"/>
  </g>

  <text x="300" y="790" text-anchor="middle" fill="#ffd447"
        font-family="'PressStart', ui-monospace, monospace" font-size="42">STEAM</text>
  <text x="300" y="842" text-anchor="middle" fill="#7a6fc0"
        font-family="'PressStart', ui-monospace, monospace" font-size="30">BIG PICTURE</text>
</svg>
