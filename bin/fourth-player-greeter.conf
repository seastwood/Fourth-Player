# Installed to /etc/lightdm/lightdm.conf.d/, so that Fourth Player can show
# the login screen instead of a black rectangle. See the script it names.
#
# The user is written in by install.sh, because LightDM runs the script as
# root and root cannot tell which account this console belongs to.
[Seat:*]
greeter-setup-script=/usr/local/bin/fourth-player-greeter-access @USER@
